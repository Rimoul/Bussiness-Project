<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
    <!-- 1. The Login Section -->
    <div id="login-section">
        <h2>Login</h2>
        <input type="email" id="login-email" placeholder="Email">
        <input type="password" id="login-password" placeholder="Password">
        <button onclick="loginUser()">Login</button>
    </div>
    
    <hr>
    <!-- THE GOOGLE BUTTON -->
    <hr>
    <div id="g_id_onload"
         data-client_id="837375612904-t6bbgp46169t7qfvn5ho9kehrc6eldb2.apps.googleusercontent.com"
         data-context="signin"
         data-ux_mode="popup"
         data-callback="handleGoogleLogin"
         data-auto_prompt="false">
    </div>
    <div class="g_id_signin"
         data-type="standard"
         data-shape="rectangular"
         data-theme="outline"
         data-text="signin_with"
         data-size="large"
         data-logo_alignment="left">
    </div>
    <!-- END GOOGLE BUTTON -->
    
    <p>Don't have an account? <a href="#" onclick="showSection('register-section')">Sign Up</a></p>
    
    <!-- 2. The Registration Section -->
    <div id="register-section">
        <h2>Sign Up</h2>
        <input type="text" id="reg-username" placeholder="Username">
        <input type="email" id="reg-email" placeholder="Email">
        <input type="password" id="reg-password" placeholder="Password">
        <button onclick="registerUser()">Sign Up</button>
    </div>

    <!-- 3. The OTP Section (Hidden by default) -->
    <div id="otp-section" style="display: none; border: 2px solid green; padding: 15px; margin-top: 15px;">
        <h2>Verify Your Email</h2>
        <p>We just sent a 6-digit code to your email. It expires in 10 minutes.</p>
        <input type="text" id="otp-code" placeholder="Enter 6-digit OTP">
        <button onclick="verifyOTP()">Verify Account</button>
        <br><br>
        
        <!-- Resend button and external timer display -->
        <button id="resend-btn" onclick="resendOTP()" disabled>Resend OTP</button>
        <span id="resend-timer-display" style="margin-left: 10px; font-weight: bold; color: #d9534f;">01:00</span>
    </div>

    <script src="auth.js"></script>
</body>
</html>
