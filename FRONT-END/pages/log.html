<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account - Seazonal Swaad</title>
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/header.css">
    <link rel="stylesheet" href="/css/footer.css">
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>

    <!-- Header Injection -->
    <div id="header-placeholder"></div>
    
    <main class="auth-page-wrapper">
        
        <!-- Corner Decorations -->
        <svg class="corner-mandala top-left" viewBox="0 0 100 100" fill="none" stroke="#C5A880" stroke-width="0.5"><circle cx="0" cy="0" r="80"/><circle cx="0" cy="0" r="60"/><path d="M0 0l80 0M0 0l56 56M0 0l0 80"/></svg>
        <svg class="corner-mandala bottom-right" viewBox="0 0 100 100" fill="none" stroke="#C5A880" stroke-width="0.5"><circle cx="100" cy="100" r="80"/><circle cx="100" cy="100" r="60"/><path d="M100 100l-80 0M100 100l-56 -56M100 100l0 -80"/></svg>
        <svg class="corner-leaf top-right" viewBox="0 0 24 24" fill="#C5A880"><path d="M12 2C12 2 4 6 4 14C4 18.4 7.6 22 12 22C16.4 22 20 18.4 20 14C20 6 12 2 12 2ZM12 18C9.8 18 8 16.2 8 14C8 10.5 12 5.5 12 5.5C12 5.5 16 10.5 16 14C16 16.2 14.2 18 12 18Z"/></svg>
        <svg class="corner-leaf bottom-left" viewBox="0 0 24 24" fill="#C5A880"><path d="M12 2C12 2 4 6 4 14C4 18.4 7.6 22 12 22C16.4 22 20 18.4 20 14C20 6 12 2 12 2ZM12 18C9.8 18 8 16.2 8 14C8 10.5 12 5.5 12 5.5C12 5.5 16 10.5 16 14C16 16.2 14.2 18 12 18Z"/></svg>

        <!-- CENTERED AUTH CARD -->
        <div class="auth-card">
            <div class="auth-header">
                <svg class="auth-logo-icon" viewBox="0 0 24 24" fill="none" stroke="#5C1E1B" stroke-width="1.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><path d="M12 8v4"></path><path d="M12 16h.01"></path></svg>
                <h1 class="auth-title">Welcome Back!</h1>
                <p class="auth-subtitle">Sign in to continue your journey with<br>Seazonal Swaad.</p>
            </div>

            <form class="auth-form">
                <!-- Email Input -->
                <div class="input-group">
                    <svg class="input-icon left" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                    <input type="email" placeholder="Email Address" required>
                </div>
                
                <!-- Password Input -->
                <div class="input-group">
                    <svg class="input-icon left" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                    <input type="password" placeholder="Password" required id="passwordInput">
                    <button type="button" class="password-toggle" aria-label="Toggle password visibility">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                </div>

                <div class="forgot-password-row">
                    <a href="#" class="forgot-link">Forgot Password?</a>
                </div>

                <button type="submit" class="btn-primary">
                    Sign In 
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                </button>
            </form>

            <div class="auth-divider">
                <span>OR</span>
            </div>

            <div class="social-login">
                <button class="btn-secondary">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
                    Continue with Google
                </button>
                <button class="btn-secondary">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#5C1E1B" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                    Continue with Email Link
                </button>
            </div>

            <p class="auth-footer-text">
                Don't have an account? <a href="#" class="signup-link">Sign Up</a>
            </p>
        </div>

        <!-- BOTTOM BANNER WITH WAVE -->
        <div class="auth-bottom-wrapper">
            <div class="wave-divider">
                <svg viewBox="0 0 1440 120" preserveAspectRatio="none"><path d="M0,60 C320,120 420,0 720,60 C1020,120 1120,0 1440,60 L1440,120 L0,120 Z" fill="#3A100E"></path></svg>
            </div>
            <section class="auth-bottom-banner">
                <svg class="banner-icon" viewBox="0 0 24 24" fill="none" stroke="#F59E0B" stroke-width="1.5"><path d="M12 2c0 0-4 4-4 10s4 10 4 10 4-4 4-10-4-10-4-10z"></path></svg>
                <h2>Bringing the taste of tradition<br>closer to you.</h2>
                <div class="hero-divider center-div"><svg viewBox="0 0 150 10" width="150" height="10"><line x1="0" y1="5" x2="150" y2="5" stroke="#C5A880" stroke-width="1"></line><circle cx="75" cy="5" r="3" fill="#C5A880"></circle></svg></div>
            </section>
        </div>
    </main>
    

    <!-- Footer Injection -->
    <div id="footer-placeholder"></div>
    
    <script src="/js/core/components.js"></script>
    <script src="/js/core/layout.js"></script>
    <script src="/js/core/router.js"></script>
</body>
</html>
